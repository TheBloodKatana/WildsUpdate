name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: gradle :android:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PokeWilds-android
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 30
